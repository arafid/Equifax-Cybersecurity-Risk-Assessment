<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Equifax Cyber Risk Landscape — 12-Month Team Forecasts</title>
  <desc id="desc">Four planning ranges: sensitive data compromise 5 to 15 percent, critical service disruption 8 to 20 percent, third-party partner compromise 12 to 30 percent, and AI or machine-identity misuse 10 to 25 percent.</desc>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">Cyber Risk Landscape</text>
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">12-month team planning forecasts</text>

  <line x1="410" y1="125" x2="1030" y2="125" stroke="#9ca3af" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">
    <text x="410" y="112">0%</text><text x="513" y="112">5%</text><text x="617" y="112">10%</text><text x="720" y="112">15%</text><text x="823" y="112">20%</text><text x="927" y="112">25%</text><text x="1030" y="112">30%</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="410" y1="125" x2="410" y2="500"/><line x1="513" y1="125" x2="513" y2="500"/><line x1="617" y1="125" x2="617" y2="500"/><line x1="720" y1="125" x2="720" y2="500"/><line x1="823" y1="125" x2="823" y2="500"/><line x1="927" y1="125" x2="927" y2="500"/><line x1="1030" y1="125" x2="1030" y2="500"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="17" fill="#1f2937">
    <text x="50" y="190">1. Sensitive Data Compromise</text>
    <text x="50" y="280">2. Critical Service Disruption</text>
    <text x="50" y="370">3. Third-Party Partner Compromise</text>
    <text x="50" y="460">4. AI / Machine-Identity Misuse</text>
  </g>

  <rect x="513" y="164" width="207" height="34" rx="17" fill="#be123c"/>
  <rect x="575" y="254" width="248" height="34" rx="17" fill="#2563eb"/>
  <rect x="658" y="344" width="372" height="34" rx="17" fill="#b7791f"/>
  <rect x="617" y="434" width="310" height="34" rx="17" fill="#7c3aed"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">
    <text x="617" y="218">5–15%</text>
    <text x="699" y="308">8–20%</text>
    <text x="844" y="398">12–30%</text>
    <text x="772" y="488">10–25%</text>
  </g>

  <text x="50" y="535" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Planning estimates developed for the academic project; not published Equifax incident rates.</text>
</svg>
